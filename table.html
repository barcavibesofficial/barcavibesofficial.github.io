<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LaLiga Table | BarcaVibesOfficial</title>

<link rel="stylesheet" href="style.css">

<style>
body{
background:#071321;
color:white;
font-family:Arial,sans-serif;
margin:0;
}

.container{
max-width:900px;
margin:auto;
padding:20px;
}

h1{
text-align:center;
color:#FFC107;
margin-bottom:20px;
}

table{
width:100%;
border-collapse:collapse;
background:#10233d;
border-radius:12px;
overflow:hidden;
}

th{
background:#004aad;
color:white;
padding:14px;
}

td{
padding:12px;
text-align:center;
border-bottom:1px solid rgba(255,255,255,.15);
}

tr:nth-child(even){
background:#0b1b30;
}

.barca{
background:#7b002c;
font-weight:bold;
color:#FFD700;
}

.note{
text-align:center;
margin-top:20px;
color:#ccc;
}
.ucl{
    background:#003366;
    color:#00d9ff;
    font-weight:bold;
}

.europa{
    background:#5b2c00;
    color:#ffb347;
    font-weight:bold;
}

.relegation{
    background:#5a0000;
    color:#ff6666;
    font-weight:bold;
}  
</style>

</head>

<body>

<div class="container">

<h1>🏆 LaLiga 2026/27 Table</h1>

<table>

<tr>
    <th>Pos</th>
    <th>Club</th>
    <th>P</th>
    <th>W</th>
    <th>D</th>
    <th>L</th>
    <th>GD</th>
    <th>Pts</th>
</tr>    
<tbody id="laliga-body">
<tr>
    <td colspan="8">Loading...</td>
</tr>
</tbody>
    
</table>

<p class="note">
Table will be updated after every LaLiga match.
</p>

</div>
<script src="laliga.js"></script>
</body>
</html>
