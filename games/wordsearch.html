<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Barcelona Word Puzzle</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#07132b;
color:white;
text-align:center;
overflow-x:hidden;
}

header{
background:#a50044;
padding:18px;
font-size:30px;
font-weight:bold;
}

#game{
max-width:800px;
margin:auto;
padding:20px;
}

#level{
font-size:28px;
font-weight:bold;
margin:15px 0;
}

#progress{
font-size:20px;
color:#ffd700;
margin-bottom:10px;
}

#grid{
display:grid;
grid-template-columns:repeat(6,55px);
gap:6px;
justify-content:center;
margin:20px auto;
}

.cell{
width:55px;
height:55px;
background:#114080;
display:flex;
justify-content:center;
align-items:center;
font-size:28px;
font-weight:bold;
border-radius:8px;
cursor:pointer;
transition:.2s;
user-select:none;
}

.cell:hover{
background:#1e5eb7;
}

.selected{
background:#ffd700;
color:#000;
}

.found{
background:#00c853;
}

#words{
display:flex;
justify-content:center;
flex-wrap:wrap;
gap:10px;
margin-top:20px;
}

.word{
padding:8px 14px;
background:#123b75;
border-radius:8px;
font-weight:bold;
}

.done{
background:#00c853;
text-decoration:line-through;
}

button{
margin:12px;
padding:12px 24px;
font-size:18px;
font-weight:bold;
border:none;
border-radius:10px;
background:#ffcc00;
cursor:pointer;
}

button:hover{
background:#ffd633;
}

#message{
font-size:28px;
font-weight:bold;
margin-top:20px;
display:none;
color:#00ff66;
}

@media(max-width:700px){

#grid{
grid-template-columns:repeat(6,45px);
}

.cell{
width:45px;
height:45px;
font-size:22px;
}

header{
font-size:24px;
}

}
.bg{
position:fixed;
left:0;
top:0;
width:100%;
height:100%;
overflow:hidden;
pointer-events:none;
z-index:-1;
}

.logo{
position:absolute;
width:90px;
opacity:.08;
animation:float 18s linear infinite;
filter:drop-shadow(0 0 15px gold);
}

.l1{
left:5%;
top:10%;
animation-duration:15s;
}

.l2{
left:80%;
top:20%;
animation-duration:18s;
}

.l3{
left:25%;
top:70%;
animation-duration:20s;
}

.l4{
left:65%;
top:80%;
animation-duration:22s;
}

.l5{
left:45%;
top:40%;
animation-duration:17s;
}

@keyframes float{

0%{
transform:translateY(0) rotate(0deg) scale(1);
}

25%{
transform:translateY(-25px) rotate(8deg) scale(1.05);
}

50%{
transform:translateY(15px) rotate(-8deg) scale(.95);
}

75%{
transform:translateY(-20px) rotate(5deg) scale(1.05);
}

100%{
transform:translateY(0) rotate(0deg) scale(1);
}

}
</style>

</head>

<body>
<div class="bg">
    <img src="../images/logo.png" class="logo l1">
    <img src="../images/logo.png" class="logo l2">
    <img src="../images/logo.png" class="logo l3">
    <img src="../images/logo.png" class="logo l4">
    <img src="../images/logo.png" class="logo l5">
</div>
<header>
🔤 Barcelona Word Puzzle
</header>

<div id="game">

<div id="level"></div>

<div id="progress"></div>

<div id="grid"></div>

<div id="words"></div>

<div id="message"></div>

<button onclick="restartGame()">
🔄 Restart
</button>

<button onclick="location.href='../games.html'">
⬅ Back
</button>

<script>
  const levels = [
{
name:"Level 1 - Young Stars",
words:["YAMAL","PEDRI","GAVI"],
grid:[
["Y","A","M","A","L","X"],
["P","E","D","R","I","Q"],
["G","A","V","I","T","L"],
["R","M","N","O","P","S"],
["A","B","C","D","E","F"],
["X","Y","Z","L","M","N"]
]
}
];

let currentLevel=0;
let found=0;
let selected=[];

const grid=document.getElementById("grid");
const words=document.getElementById("words");
const level=document.getElementById("level");
const progress=document.getElementById("progress");
const message=document.getElementById("message");

loadLevel();

function loadLevel(){

const data=levels[currentLevel];

level.innerHTML=data.name;

progress.innerHTML="Words Found: 0 / "+data.words.length;

grid.innerHTML="";
words.innerHTML="";

found=0;
selected=[];

data.words.forEach(word=>{

words.innerHTML+=
`<div class="word" id="${word}">${word}</div>`;

});

data.grid.forEach(row=>{

row.forEach(letter=>{

const cell=document.createElement("div");

cell.className="cell";

cell.innerHTML=letter;

cell.onclick=function(){

selectCell(cell);

};

grid.appendChild(cell);

});

});

}

function selectCell(cell){

if(cell.classList.contains("found")) return;

cell.classList.toggle("selected");

updateSelection();

}

function updateSelection(){

selected=[];

let text="";

document.querySelectorAll(".selected").forEach(c=>{

selected.push(c);

text+=c.innerHTML;

});

checkWord(text);

}
  function checkWord(text){

const data=levels[currentLevel];

data.words.forEach(word=>{

if(text===word){

selected.forEach(c=>{

c.classList.remove("selected");

c.classList.add("found");

});

document.getElementById(word).classList.add("done");

found++;

progress.innerHTML=
"Words Found: "+found+" / "+data.words.length;

selected=[];

if(found===data.words.length){

message.style.display="block";

message.innerHTML="🏆 Level Complete!";

setTimeout(function(){

message.style.display="none";

alert("🎉 You completed Level 1!");

},500);

}

}

});

}

function restartGame(){

loadLevel();

}

</script>

</body>
</html>
