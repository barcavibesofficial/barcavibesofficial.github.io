<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Barcelona Word Search</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#08142d;
color:#fff;
text-align:center;
overflow-x:hidden;
}

header{
background:#a50044;
padding:18px;
font-size:30px;
font-weight:bold;
}

#game{
max-width:900px;
margin:auto;
padding:20px;
}

#topBar{
display:flex;
justify-content:space-between;
align-items:center;
flex-wrap:wrap;
gap:10px;
margin-bottom:20px;
}

#level{
font-size:24px;
font-weight:bold;
}

#timer{
font-size:22px;
color:#ffcc00;
}

#score{
font-size:20px;
color:#00ff66;
}

#grid{
display:grid;
gap:3px;
justify-content:center;
margin:25px auto;
touch-action:none;
user-select:none;
}

.cell{
width:42px;
height:42px;
background:#14366d;
border:2px solid #204d8f;
display:flex;
justify-content:center;
align-items:center;
font-size:22px;
font-weight:bold;
cursor:pointer;
transition:.15s;
}

.cell:hover{
background:#255cb4;
}

.selected{
background:#ffcc00;
color:#000;
}

.found{
background:#00c853;
color:#fff;
}

#wordList{
display:flex;
justify-content:center;
flex-wrap:wrap;
gap:10px;
margin-top:20px;
}

.word{
padding:8px 14px;
background:#16396f;
border-radius:8px;
font-weight:bold;
}

.done{
background:#00c853;
text-decoration:line-through;
}

#message{
margin-top:20px;
font-size:28px;
font-weight:bold;
display:none;
color:#00ff66;
}

.buttons{
margin-top:25px;
}

button{
padding:12px 22px;
margin:6px;
font-size:18px;
font-weight:bold;
border:none;
border-radius:8px;
background:#ffcc00;
cursor:pointer;
}

button:hover{
background:#ffd633;
}

@media(max-width:700px){

.cell{
width:34px;
height:34px;
font-size:18px;
}

header{
font-size:24px;
}

#level{
font-size:20px;
}

#timer{
font-size:18px;
}

#score{
font-size:18px;
}

.word{
font-size:15px;
padding:6px 10px;
}

button{
font-size:15px;
padding:10px 16px;
}

}

</style>

</head>

<body>

<header>
🔤 Barcelona Word Search
</header>

<div id="game">

<div id="topBar">

<div id="level">
Level 1
</div>

<div id="timer">
⏱ 03:00
</div>

<div id="score">
0 / 0 Words
</div>

</div>

<div id="grid"></div>

<div id="wordList"></div>

<div id="message"></div>

<div class="buttons">

<button id="hintBtn">
💡 Hint
</button>

<button id="restartBtn">
🔄 Restart
</button>

<button onclick="location.href='../games.html'">
⬅ Back
</button>

</div>

<script>
