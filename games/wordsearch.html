<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>Barcelona Word Search</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial,sans-serif;
background:#07132b;
color:#fff;
overflow-x:hidden;
position:relative;
}

/* Animated Background */

body::before{
content:"";
position:fixed;
width:100%;
height:100%;
left:0;
top:0;
background:
radial-gradient(circle,#004d98 0%,transparent 60%),
radial-gradient(circle,#a50044 0%,transparent 60%);
opacity:.25;
animation:bgMove 12s linear infinite alternate;
z-index:-3;
}

@keyframes bgMove{

0%{
transform:scale(1) rotate(0deg);
}

100%{
transform:scale(1.3) rotate(8deg);
}

}

/* Floating Logo */

.logo-bg{

position:fixed;

top:50%;
left:50%;

transform:translate(-50%,-50%);

width:330px;

opacity:.08;

animation:logoFloat 8s ease-in-out infinite;

pointer-events:none;

z-index:-2;

}

.logo-bg img{

width:100%;

filter:
drop-shadow(0 0 20px gold);

}

@keyframes logoFloat{

0%{

transform:
translate(-50%,-50%)
scale(1);

}

50%{

transform:
translate(-50%,-53%)
scale(1.08)
rotate(3deg);

}

100%{

transform:
translate(-50%,-50%)
scale(1);

}

}

/* Header */

header{

background:#a50044;

padding:20px;

font-size:34px;

font-weight:bold;

text-align:center;

box-shadow:0 5px 15px rgba(0,0,0,.5);

}

#game{

max-width:900px;

margin:auto;

padding:25px;

text-align:center;

}

#level{

font-size:34px;

font-weight:bold;

margin-top:10px;

}

#progress{

margin-top:15px;

font-size:24px;

color:#ffd700;

}

#timer{

margin-top:12px;

font-size:22px;

color:#00e5ff;

}

#hint{

margin-top:12px;

font-size:18px;

color:#8bc34a;

}

/* Puzzle */

#grid{

display:grid;

justify-content:center;

gap:5px;

margin-top:35px;

}

.cell{

width:52px;

height:52px;

background:#143b76;

border-radius:8px;

display:flex;

justify-content:center;

align-items:center;

font-size:28px;

font-weight:bold;

cursor:pointer;

transition:.2s;

user-select:none;

}

.cell:hover{

background:#1e5aa8;

}

.selected{

background:#ffd600;

color:#000;

transform:scale(1.1);

}

.found{

background:#00c853;

color:white;

}

.wordFound{

text-decoration:line-through;

color:#00ff66;

font-weight:bold;

}

#words{

margin-top:35px;

display:flex;

flex-wrap:wrap;

justify-content:center;

gap:12px;

font-size:20px;

}
  button{

padding:15px 35px;

margin:12px;

border:none;

border-radius:12px;

background:#ffcc00;

color:#000;

font-size:20px;

font-weight:bold;

cursor:pointer;

transition:.25s;

}

button:hover{

transform:scale(1.05);

background:#ffd633;

}

#nextBtn{

display:none;

}

#restartBtn{

display:none;

}

@media(max-width:700px){

header{

font-size:26px;

}

#level{

font-size:26px;

}

#progress{

font-size:20px;

}

#timer{

font-size:20px;

}

.cell{

width:46px;

height:46px;

font-size:24px;

}

.logo-bg{

width:250px;

}

}

</style>

</head>

<body>

<div class="logo-bg">

<img src="../images/logo.png">

</div>

<header>

🔤 Barcelona Word Search

</header>

<div id="game">

<div id="level"></div>

<div id="progress"></div>

<div id="timer">
⏱ Time: 60
</div>

<div id="hint">
Find all Barcelona words!
</div>

<div id="grid"></div>

<div id="words"></div>

<br>

<button id="nextBtn" onclick="nextLevel()">
➡ Next Level
</button>

<button id="restartBtn" onclick="restartGame()">
🔄 Restart Game
</button>

<button onclick="location.href='../games.html'">
⬅ Back to Games
</button>

</div>
