<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Penalty Shootout | BarcaVibesOfficial</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#07152f;
overflow:hidden;
color:#fff;
text-align:center;
}

/* Floating Background Logos */

.bg{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
pointer-events:none;
overflow:hidden;
z-index:-1;
}

.logo{
position:absolute;
width:90px;
opacity:.07;
animation:float 18s linear infinite;
}

.l1{top:8%;left:4%;}
.l2{top:18%;right:8%;}
.l3{bottom:18%;left:12%;}
.l4{bottom:10%;right:15%;}
.l5{top:45%;left:45%;}

@keyframes float{

0%{
transform:translateY(0) rotate(0deg);
}

50%{
transform:translateY(-25px) rotate(8deg);
}

100%{
transform:translateY(0) rotate(0deg);
}

}

header{

padding:15px;

}

header h1{

font-size:clamp(28px,5vw,48px);

}

#score{

font-size:28px;
font-weight:bold;
color:#ffd700;
margin-top:5px;

}

#field{

position:relative;
width:100%;
height:72vh;
min-height:450px;
background:url("../images/stadium.jpg") center/cover no-repeat;
overflow:hidden;

}

/* Goal */

#goal{

position:absolute;
top:6%;
left:50%;
transform:translateX(-50%);
width:min(360px,70vw);
aspect-ratio:2/1;
background:url("../images/goal.png") center/contain no-repeat;
z-index:4;

}

/* Keeper */

#keeper{

position:absolute;
top:13%;
left:50%;
transform:translateX(-50%);
width:80px;
height:80px;
background:url("../images/keeper.png") center/contain no-repeat;
transition:left .35s ease;
z-index:20;

}

/* Ball */

#ball{

position:absolute;
left:50%;
bottom:35px;
transform:translateX(-50%);
width:72px;
height:72px;
background:url("../images/ball.png") center/contain no-repeat;
transition:left .75s ease,bottom .75s ease,width .75s ease,height .75s ease;
z-index:30;

}

#message{

position:absolute;
left:50%;
top:42%;
transform:translateX(-50%);
font-size:42px;
font-weight:bold;
text-shadow:0 0 10px #000;
display:none;
z-index:100;

}

.goal{

color:#00ff66;

}

.saved{

color:#ff4444;

}

button{

margin:20px auto;
padding:16px 45px;
font-size:26px;
font-weight:bold;
border:none;
border-radius:14px;
background:#ffcc00;
cursor:pointer;

}

button:hover{

background:#ffd633;

}

@media(max-width:768px){

#field{
height:65vh;
}

#goal{
width:260px;
}

#keeper{
width:65px;
height:65px;
}

#ball{
width:56px;
height:56px;
}

#message{
font-size:32px;
}

button{
font-size:22px;
padding:14px 34px;
}

}

</style>

</head>

<body>

<div class="bg">

<img src="../images/logo.png" class="logo l1">
<img src="../images/logo.png" class="logo l2">
<img src="../images/logo.png" class="logo l3">
<img src="../images/logo.png" class="logo l4">
<img src="../images/logo.png" class="logo l5">

</div>

<header>

<h1>⚽ Penalty Shootout</h1>

<div id="score">
Score:
<span id="points">0</span>
</div>

</header>

<div id="field">

<div id="goal"></div>

<div id="keeper"></div>

<div id="message"></div>

<div id="ball"></div>

</div>

<button onclick="kickBall()">⚽ SHOOT</button>

<button onclick="restartGame()">🔄 RESTART</button>

<script>
let score = 0;
let playing = false;

const ball = document.getElementById("ball");
const keeper = document.getElementById("keeper");
const message = document.getElementById("message");
const points = document.getElementById("points");

const keeperPos = ["35%","50%","65%"];
const shotPos = ["40%","50%","60%"];

function kickBall(){

if(playing) return;

playing = true;

message.style.display = "none";

// Random positions
const keeperSide = Math.floor(Math.random()*3);
const shotSide = Math.floor(Math.random()*3);

// Keeper dives
keeper.style.left = keeperPos[keeperSide];

// Reset ball instantly
ball.style.transition = "none";

ball.style.left = "50%";
ball.style.bottom = "35px";
ball.style.width = "72px";
ball.style.height = "72px";

void ball.offsetWidth;

// Shoot animation
ball.style.transition =
"left .75s ease,bottom .75s ease,width .75s ease,height .75s ease";

ball.style.left = shotPos[shotSide];
ball.style.bottom = "68%";
ball.style.width = "26px";
ball.style.height = "26px";

// Result
setTimeout(function(){

if(keeperSide===shotSide){

message.innerHTML="🧤 SAVED!";
message.className="saved";

}else{

score++;

points.innerHTML=score;

message.innerHTML="⚽ GOAL!";
message.className="goal";

}

message.style.display="block";

},800);

// Return animation
setTimeout(function(){

ball.style.transition =
"left .45s ease,bottom .45s ease,width .45s ease,height .45s ease";

ball.style.left="50%";
ball.style.bottom="35px";
ball.style.width="72px";
ball.style.height="72px";

keeper.style.left="50%";

},1700);

setTimeout(function(){

message.style.display="none";

playing=false;

},2200);
  // Smooth keeper return
setTimeout(function(){

keeper.style.transition="left .3s ease";
keeper.style.left="50%";

},1200);

// Hide message
setTimeout(function(){

message.style.display="none";

},1800);

// Ready for next shot
setTimeout(function(){

playing=false;

},2000);

// Restart score
function restartGame(){

score=0;

points.innerHTML=0;

message.style.display="none";

keeper.style.left="50%";

ball.style.left="50%";
ball.style.bottom="35px";
ball.style.width="72px";
ball.style.height="72px";

playing=false;

}

</script>

</body>
</html>
