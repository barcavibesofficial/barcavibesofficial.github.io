<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Penalty Shootout | BarcaVibesOfficial</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#0b3d0b;
font-family:Arial,sans-serif;
text-align:center;
color:#fff;
overflow-x:hidden;
}

h1{
margin:15px 0;
font-size:clamp(28px,5vw,42px);
}

#score{
font-size:clamp(18px,3vw,24px);
margin-bottom:10px;
font-weight:bold;
}

#field{
position:relative;
width:100%;
height:70vh;
min-height:420px;
max-height:700px;
background:url("../images/stadium.jpg") center center/cover no-repeat;
overflow:hidden;
}

#goal{
position:absolute;
left:50%;
top:4%;
transform:translateX(-50%);
width:32%;
max-width:340px;
min-width:180px;
aspect-ratio:16/10;
background:url("../images/goal.png") center/contain no-repeat;
z-index:5;
}

#keeper{
position:absolute;
left:50%;
top:12%;
transform:translateX(-50%);
width:10%;
max-width:90px;
min-width:55px;
aspect-ratio:1/1;
background:url("../images/keeper.png") center/contain no-repeat;
transition:.25s;
z-index:20;
}

#message{
position:absolute;
left:50%;
top:42%;
transform:translateX(-50%);
font-size:clamp(26px,5vw,42px);
font-weight:bold;
display:none;
text-shadow:2px 2px 8px #000;
width:100%;
z-index:1000;
}

.goal{
color:#00ff66;
}

.saved{
color:#ff4444;
}

#ball{
position:absolute;
left:50%;
bottom:5%;
transform:translateX(-50%);
width:8%;
max-width:75px;
min-width:45px;
aspect-ratio:1/1;
background:url("../images/ball.png") center/contain no-repeat;
transition:.6s;
z-index:999;
}

button{
margin:20px auto;
padding:15px 35px;
font-size:22px;
font-weight:bold;
background:#ffcc00;
border:none;
border-radius:12px;
cursor:pointer;
}

button:hover{
background:#ffd633;
}

@media(max-width:768px){

#field{
height:60vh;
}

#goal{
width:52%;
}

#keeper{
width:18%;
top:14%;
}

#ball{
width:14%;
}

button{
width:90%;
max-width:320px;
}

}

</style>
</head>

<body>

<h1>⚽ Penalty Shootout</h1>

<div id="score">
Score:
<span id="points">0</span>
</div>

<div id="field">

<div id="goal"></div>

<div id="keeper"></div>

<div id="message"></div>

<div id="ball"></div>

</div>

<button onclick="kickBall()">Shoot</button>
<script>

let score = 0;

function kickBall(){

const ball = document.getElementById("ball");
const keeper = document.getElementById("keeper");
const message = document.getElementById("message");

// Keeper position
const keeperPos = Math.floor(Math.random()*3);

const keeperLeft = ["35%","50%","65%"];
keeper.style.left = keeperLeft[keeperPos];

// Ball direction
const shot = Math.floor(Math.random()*3);

const moveX = ["-18vw","0vw","18vw"];
const moveY = "-55vh";

ball.style.transform =
`translate(calc(-50% + ${moveX[shot]}), ${moveY}) scale(.35)`;

// Goal or save
setTimeout(function(){

if(shot===keeperPos){

message.innerHTML="🧤 SAVED!";
message.className="saved";

}else{

score++;
document.getElementById("points").innerHTML=score;

message.innerHTML="⚽ GOAL!";
message.className="goal";

}

message.style.display="block";

},500);

// Reset
setTimeout(function(){

ball.style.transform="translateX(-50%)";
keeper.style.left="50%";
message.style.display="none";

},1200);

}

</script>

</body>
</html>
