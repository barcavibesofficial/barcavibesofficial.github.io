<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Penalty Shootout</title>

<style>

body{
    margin:0;
    background:#0b3d0b;
    font-family:Arial,sans-serif;
    text-align:center;
    color:#fff;
    overflow:hidden;
}

h1{
    margin:20px 0 10px;
}

#score{
    font-size:18px;
    margin-bottom:15px;
}

#field{
    width:100%;
    height:560px;
    background:url("../images/stadium.jpg") center/cover no-repeat;
    position:relative;
    overflow:hidden;
}

#goal{
    width:280px;
    height:140px;
    border:6px solid #fff;
    position:absolute;
    left:50%;
    top:40px;
    transform:translateX(-50%);
}

#ball{
    width:70px;
    height:70px;
    background-image:url("../images/ball.png");
    background-size:contain;
    background-repeat:no-repeat;
    background-position:center;
    position:absolute;
    left:50%;
    bottom:30px;
    transform:translateX(-50%);
    transition:0.6s;
    z-index:9999;
    display:block;
}

button{
    margin-top:20px;
    padding:15px 40px;
    font-size:20px;
    background:#ffcc00;
    border:none;
    border-radius:10px;
    cursor:pointer;
}
button:hover{
background:#ffd633;
}

#keeper{
width:80px;
height:80px;
background:url("../images/keeper.png") center/contain no-repeat;
position:absolute;
top:70px;
left:50%;
transform:translateX(-50%);
transition:0.15s linear;
z-index:20;
}

#message{
position:absolute;
top:220px;
left:50%;
transform:translateX(-50%);
font-size:36px;
font-weight:bold;
display:none;
text-shadow:2px 2px 8px #000;
z-index:30;
}

.goal{
color:#00ff66;
}

.saved{
color:#ff4444;
}

</style>
</head>

<body>

<h1>⚽ Penalty Shootout</h1>

<div id="score">
Score :
<span id="points">0</span>
</div>

<div id="field">

<div id="goal"></div>

<div id="keeper"></div>

<div id="message"></div>

<div id="ball"></div>

</div>

<button onclick="kickBall()">Shoot</button>

    <script>

let score = 0;

function kickBall(){

const ball = document.getElementById("ball");
const keeper = document.getElementById("keeper");
const message = document.getElementById("message");

// Random keeper position
let keeperPos = Math.floor(Math.random()*3);

if(keeperPos==0){
keeper.style.left="35%";
}

if(keeperPos==1){
keeper.style.left="50%";
}

if(keeperPos==2){
keeper.style.left="65%";
}

// Random shot
let shot = Math.floor(Math.random()*3);

let x=0;

if(shot==0){
x=-110;
}

if(shot==1){
x=0;
}

if(shot==2){
x=110;
}

// Ball animation
ball.style.transform=
`translate(${x}px,-420px) scale(0.25)`;

// Check goal or save
setTimeout(function(){

if(shot==keeperPos){

message.innerHTML="🧤 SAVED!";
message.className="saved";

}else{

score++;
document.getElementById("points").innerHTML=score;

message.innerHTML="⚽ GOAL!";
message.className="goal";

}

message.style.display="block";

},500);

// Reset after animation
setTimeout(function(){

ball.style.transform="translateX(-50%) scale(1)";
keeper.style.left="50%";
message.style.display="none";

},1200);

}
        
</script>

</body>
</html>

</body>
</html>
