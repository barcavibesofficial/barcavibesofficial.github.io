<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Penalty Shootout</title>

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#063d06;
    color:#fff;
    text-align:center;
    overflow:hidden;
}

h1{
    margin:20px 0 10px;
}

#score{
    font-size:28px;
    margin-bottom:15px;
}

#field{
    width:100%;
    height:600px;
    background:url("../images/stadium.jpg") center/cover no-repeat;
    position:relative;
    overflow:hidden;
}

#goal{
    width:320px;
    height:160px;
    border:8px solid #fff;
    position:absolute;
    left:50%;
    top:40px;
    transform:translateX(-50%);
}

#ball{
    width:70px;
    height:70px;
    background:url("ball.png") center/contain no-repeat;
    position:absolute;
    left:50%;
    bottom:70px;
    transform:translateX(-50%);
    transition:0.6s;
    z-index:100;
}

button{
    margin-top:20px;
    padding:15px 40px;
    font-size:20px;
    background:#ffcc00;
    border:none;
    border-radius:10px;
    cursor:pointer;
}

</style>
</head>
<body>

<h1>⚽ Penalty Shootout</h1>

<div id="score">
Score : <span id="points">0</span>
</div>

<div id="field">
    <div id="goal"></div>
    <div id="ball"></div>
</div>

<br>

<button onclick="kickBall()">Shoot</button>

<script>

let score = 0;

function kickBall(){

    let ball = document.getElementById("ball");
    let x = Math.random() * 220 - 110;

    ball.style.transform = `translate(${x}px,-420px) scale(0.25)`;

    setTimeout(() => {

        score++;
        document.getElementById("points").innerHTML = score;

        ball.style.left = "50%";
        ball.style.bottom = "70px";
        ball.style.transform = "translateX(-50%) scale(1)";

    }, 600);

}

</script>

</body>
</html>
