<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Penalty Shootout | BarcaVibesOfficial</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#0b3d0b;
font-family:Arial,sans-serif;
text-align:center;
color:#fff;
overflow-x:hidden;
}

h1{
padding:15px 10px 5px;
font-size:clamp(30px,5vw,48px);
}

#score{
font-size:24px;
font-weight:bold;
margin-bottom:10px;
}

#field{
position:relative;
width:100%;
height:72vh;
min-height:450px;
max-height:750px;
background:url("../images/stadium.jpg") center/cover no-repeat;
overflow:hidden;
}

#goal{
position:absolute;
left:50%;
top:5%;
transform:translateX(-50%);
width:min(340px,70vw);
height:220px;
background:url("../images/goal.png") center/contain no-repeat;
z-index:5;
}

#keeper{
position:absolute;
left:50%;
top:90px;
transform:translateX(-50%);
width:75px;
height:75px;
background:url("../images/keeper.png") center/contain no-repeat;
transition:.35s ease;
z-index:20;
}

#ball{
position:absolute;
left:50%;
bottom:35px;
transform:translateX(-50%);
width:60px;
height:60px;
background:url("../images/ball.png") center/contain no-repeat;
transition:.65s ease;
z-index:50;
}

#message{
position:absolute;
left:50%;
top:45%;
transform:translateX(-50%);
font-size:42px;
font-weight:bold;
display:none;
text-shadow:3px 3px 10px #000;
z-index:100;
}

.goal{
color:#00ff66;
}

.saved{
color:#ff4444;
}

button{
margin:20px auto;
width:90%;
max-width:320px;
padding:16px;
font-size:28px;
font-weight:bold;
border:none;
border-radius:14px;
background:#ffcc00;
cursor:pointer;
}

button:hover{
background:#ffd633;
}

@media (max-width:768px){

#field{
height:65vh;
}

#goal{
width:250px;
height:170px;
top:30px;
}

#keeper{
width:60px;
height:60px;
top:75px;
}

#ball{
width:45px;
height:45px;
bottom:25px;
}

#message{
font-size:34px;
}

}

</style>

</head>

<body>

<h1>⚽ Penalty Shootout</h1>

<div id="score">
Score:
<span id="points">0</span>
</div>

<div id="field">

<div id="goal"></div>

<div id="keeper"></div>

<div id="message"></div>

<div id="ball"></div>

</div>

<button onclick="kickBall()">Shoot</button>
<script>

let score = 0;
let playing = false;

function kickBall(){

if(playing) return;
playing = true;

const ball = document.getElementById("ball");
const keeper = document.getElementById("keeper");
const message = document.getElementById("message");

// Hide previous message
message.style.display = "none";

// Random keeper position
const keeperPos = Math.floor(Math.random()*3);

// Goal positions
const keeperLeft = ["38%","50%","62%"];
keeper.style.left = keeperLeft[keeperPos];

// Ball target
const shot = Math.floor(Math.random()*3);

const ballX = ["-16vw","0vw","16vw"];

// Realistic ball animation
ball.style.transition = ".65s ease";
ball.style.left = ["38%","50%","62%"][shot];
ball.style.bottom = "65%";
ball.style.transform = "translateX(-50%) scale(0.35)";

// Check result
setTimeout(function(){

if(shot===keeperPos){

message.innerHTML="🧤 SAVED!";
message.className="saved";

}else{

score++;
document.getElementById("points").innerHTML=score;

message.innerHTML="⚽ GOAL!";
message.className="goal";

}

message.style.display="block";

},650);

// Reset
setTimeout(function(){

ball.style.left = "50%";
ball.style.bottom = "35px";
ball.style.transform = "translateX(-50%) scale(1)";

keeper.style.left="50%";

message.style.display="none";

playing=false;

// Re-enable animation for next shot
setTimeout(function(){
ball.style.transition=".65s ease";
},20);

},1500);

</script>
}
</body>
</html>
