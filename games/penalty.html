<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Penalty Shootout | BarcaVibesOfficial</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#071632;
font-family:Arial,sans-serif;
overflow:hidden;
text-align:center;
color:#fff;
}

header{
padding:18px;
font-size:42px;
font-weight:bold;
}

#score{
font-size:34px;
color:#ffd700;
margin-bottom:10px;
font-weight:bold;
}

#field{

position:relative;
width:100%;
height:72vh;

background:url("../images/stadium.jpg") center center/cover no-repeat;

overflow:hidden;

}

#goal{

position:absolute;

top:50px;
left:50%;

transform:translateX(-50%);

width:320px;
height:180px;

background:url("../images/goal.png") center/contain no-repeat;

z-index:5;

}

#keeper{

position:absolute;

top:78px;
left:50%;

transform:translateX(-50%);

width:85px;
height:85px;

background:url("../images/keeper.png") center/contain no-repeat;

z-index:15;

transition:.35s;

}

#ball{

position:absolute;

bottom:40px;
left:50%;

width:65px;
height:65px;

transform:translateX(-50%);

background:url("../images/ball.png") center/contain no-repeat;

z-index:30;

}

#message{

position:absolute;

top:45%;
left:50%;

transform:translate(-50%,-50%);

font-size:48px;
font-weight:bold;

display:none;

text-shadow:0 0 15px #000;

z-index:100;

}

.goal{color:#00ff66;}
.saved{color:#ff4444;}

button{

margin-top:18px;

width:270px;

padding:18px;

font-size:28px;

font-weight:bold;

border:none;

border-radius:14px;

background:#ffcc00;

cursor:pointer;

}

button:hover{

background:#ffd633;

}
@media(max-width:768px){

header{
font-size:32px;
}

#score{
font-size:28px;
}

#field{
height:68vh;
}

#goal{
width:240px;
height:140px;
top:35px;
}

#keeper{
width:65px;
height:65px;
top:55px;
}

#ball{
width:48px;
height:48px;
bottom:30px;
}

#message{
font-size:34px;
}

button{
width:85%;
font-size:24px;
}

}

</style>

</head>

<body>

<header>⚽ Penalty Shootout</header>

<div id="score">
Score:
<span id="points">0</span>
</div>

<div id="field">

<div id="goal"></div>

<div id="keeper"></div>

<div id="message"></div>

<div id="ball"></div>

</div>

<button onclick="kickBall()">⚽ SHOOT</button>

<button onclick="restartGame()">🔄 RESTART</button>

<script>

let score = 0;
let playing = false;

const ball = document.getElementById("ball");
const keeper = document.getElementById("keeper");
const message = document.getElementById("message");
const points = document.getElementById("points");
  function kickBall(){

if(playing) return;
playing = true;

message.style.display = "none";

// Random keeper
const keeperSide = Math.floor(Math.random()*3);
const keeperX = ["35%","50%","65%"];
keeper.style.left = keeperX[keeperSide];

// Random shot
const shotSide = Math.floor(Math.random()*3);
const shotX = ["38%","50%","62%"];

// Reset ball
ball.style.transition = "none";
ball.style.left = "50%";
ball.style.bottom = "40px";
ball.style.width = "65px";
ball.style.height = "65px";

void ball.offsetWidth;

// Shoot
ball.style.transition = "all .8s ease";

ball.style.left = shotX[shotSide];
ball.style.bottom = "300px";
ball.style.width = "24px";
ball.style.height = "24px";

setTimeout(function(){

if(shotSide===keeperSide){

message.innerHTML="🧤 SAVED!";
message.className="saved";

}else{

score++;
points.innerHTML=score;

message.innerHTML="⚽ GOAL!";
message.className="goal";

}

message.style.display="block";

},800);

// Return ball
setTimeout(function(){

ball.style.transition="all .5s ease";

ball.style.left="50%";
ball.style.bottom="40px";
ball.style.width="65px";
ball.style.height="65px";

keeper.style.left="50%";

},1600);

setTimeout(function(){

message.style.display="none";
playing=false;

},2100);

}

function restartGame(){

score=0;
points.innerHTML=0;

ball.style.transition="none";
ball.style.left="50%";
ball.style.bottom="40px";
ball.style.width="65px";
ball.style.height="65px";

keeper.style.left="50%";

message.style.display="none";

playing=false;

}

</script>

</body>
</html>
