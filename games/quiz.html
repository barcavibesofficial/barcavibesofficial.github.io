<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Barcelona Player Quiz</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#08142d;
color:white;
text-align:center;
}

h1{
background:#a50044;
padding:20px;
margin:0;
}

#quiz{
max-width:600px;
margin:40px auto;
background:#10244f;
padding:25px;
border-radius:15px;
}

button{
display:block;
width:100%;
margin:10px 0;
padding:15px;
font-size:18px;
background:#ffcc00;
border:none;
border-radius:10px;
cursor:pointer;
}

button:hover{
background:#ffd633;
}

#result{
margin-top:20px;
font-size:22px;
font-weight:bold;
}

#score{
font-size:20px;
margin-top:20px;
}
</style>
</head>

<body>

<h1>🧩 Barcelona Player Quiz</h1>

<div id="quiz">

<h2 id="question"></h2>

<div id="answers"></div>

<div id="result"></div>

<div id="score">Score: 0</div>

</div>

<script>

const quiz=[
{
q:"Who wears number 19?",
a:["Lamine Yamal","Lewandowski","Pedri","Gavi"],
c:0
},
{
q:"Who is Barcelona's striker?",
a:["Cubarsi","Lewandowski","Kounde","Fermin"],
c:1
},
{
q:"Who plays in midfield?",
a:["Pedri","Ter Stegen","Araujo","Balde"],
c:0
},
{
q:"Who is Barcelona's goalkeeper?",
a:["Szczesny","Pedri","Raphinha","Gavi"],
c:0
},
{
q:"Who usually plays at left back?",
a:["Balde","Cubarsi","Olmo","Ferran"],
c:0
}
];

let current=0;
let score=0;

function loadQuestion(){

document.getElementById("result").innerHTML="";

let q=quiz[current];

document.getElementById("question").innerHTML=q.q;

let html="";

q.a.forEach((ans,index)=>{

html+=`<button onclick="check(${index})">${ans}</button>`;

});

document.getElementById("answers").innerHTML=html;

}

function check(index){

if(index==quiz[current].c){

score++;

document.getElementById("result").innerHTML="✅ Correct!";

}else{

document.getElementById("result").innerHTML="❌ Wrong!";

}

document.getElementById("score").innerHTML="Score: "+score;

current++;

setTimeout(function(){

if(current<quiz.length){

loadQuestion();

}else{

document.getElementById("quiz").innerHTML=
"<h2>🎉 Quiz Finished!</h2><h3>Your Score: "+score+" / "+quiz.length+"</h3>";

}

},1000);

}

loadQuestion();

</script>

</body>
</html>
