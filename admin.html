<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Barca Vibes Official Admin</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header class="page-header">

<h1>🔵🔴 Barca Vibes Official</h1>

<p>Admin Dashboard</p>

<a href="index.html" class="btn">🏠 Home</a>

</header>


<section class="container">

<div class="card">

<h2>📰 Publish News</h2>


<input id="newsTitle" 
placeholder="News title">


<select id="newsCategory">

<option>Breaking News</option>

<option>Transfer News</option>

<option>Match Update</option>

<option>Club News</option>

</select>


<input type="file"
id="newsImageFile"
accept="image/*">


<textarea id="newsContent"
placeholder="Write article here..."></textarea>


<button onclick="publishNews()">
🚀 Publish Article
</button>

<hr>

<h2>🛠 Manage Articles</h2>

<div id="adminNewsList"></div>


</div>


</section>


<script type="module">
import { db, storage } from "./firebase.js";

import {
  collection,
  addDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

import {
  ref,
  uploadBytes,
  getDownloadURL
} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-storage.js";

window.publishNews = async function () {
  try {
    let title = document.getElementById("newsTitle").value;
    let category = document.getElementById("newsCategory").value;
    const file = document.getElementById("newsImageFile").files[0];

let image = "";

if (file) {
    const imageRef = ref(storage, "news/" + Date.now() + "_" + file.name);

    await uploadBytes(imageRef, file);

    image = await getDownloadURL(imageRef);
}
    let content = document.getElementById("newsContent").value;

    if (!title || !content) {
      alert("Fill title and article");
      return;
    }

    await addDoc(collection(db, "news"), {
      title,
      category,
      image,
      content,
      created: serverTimestamp()
    });

    alert("✅ News Published Successfully!");

    document.getElementById("newsTitle").value = "";
    document.getElementById("newsImageFile").value = "";
    document.getElementById("newsContent").value = "";

  } catch (err) {
    alert("❌ " + err.message);
    console.error(err);
  }
};
</script>

</body>
</html>
