<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Barca Music</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>

<body class="music-page">

<header>

<div class="logo">
🔵🔴 BarcaVibesOfficial
</div>

<nav>
<a href="index.html">Home</a>
<a href="news.html">News</a>
<a href="matches.html">Matches</a>
<a href="gallery.html">Gallery</a>
<a href="music.html" class="active">Music</a>
</nav>

</header>

<div class="music-container">

<div class="player">

<div class="disc">

<img id="cover"
     src="images/bvo-music-logo.png"
     alt="Barca Music">

</div>

<h2 id="title">
Anthem
</h2>

<p id="artist">
BarcaVibesOfficial
</p>

<audio id="audio"></audio>

<div class="progress-container">

<span id="current">
0:00
</span>

<input
type="range"
id="progress"
value="0"
min="0"
max="100">

<span id="duration">
0:00
</span>

</div>

<div class="controls">

<button id="prev">
⏮
</button>

<button id="play">
▶️
</button>

<button id="next">
⏭
</button>

</div>

<div class="volume">

🔊

<input
type="range"
id="volume"
min="0"
max="1"
step="0.01"
value="1">

</div>

</div>

<div class="playlist">

<h3>Playlist</h3>

<ul id="playlist">

<li data-index="0">
🎵 Anthem
</li>

<li data-index="1">
🌙 Haneef Night
</li>

<li data-index="2">
⭐ Lamine Yamal Y Que Fue
</li>

<li data-index="3">
🔥 Rack City Glass Teeth
</li>

</ul>

</div>

</div>

<script src="music.js"></script>

</body>
</html>
